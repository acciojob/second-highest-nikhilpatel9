<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>	
	<script>
		function secondHighest(arr) {
			//Write your code here
			if (arr.length<2) {
				return -Infinity;
			}
			let first = -Infinity;
			let second = -Infinity;

			for (let i = 0; i < arr.length; i++) {
				const current = Number(arr[i]); 

				if (current > first) {
					second = first;
					first = current;
				} else if (current < first && current > second) {
					second = current;
				}
			}

			return second;
			
		}

		function Main() {
			var n = prompt("Enter the number of elements");
			var arr = [];
			for (var i = 0; i < n; i++) {
				arr[i] = prompt("Enter element " + (i+1));
			}
			alert(secondHighest(arr));
		}
		Main();
	</script>

    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
